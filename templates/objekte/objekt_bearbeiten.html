{% extends "basis.html" %}

{% block titel %}{{ objekt }} bearbeiten · Objektradar{% endblock %}

{% block inhalt %}
  <h1>{{ objekt }} bearbeiten</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Speichern</button>
    <a href="{% url 'objekt' objekt.pk %}">Abbrechen</a>
  </form>
{% endblock %}
