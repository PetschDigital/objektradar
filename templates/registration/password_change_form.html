{% extends "basis.html" %}

{% block titel %}Passwort ändern · Objektradar{% endblock %}

{% block inhalt %}
  <h1>Passwort ändern</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Passwort ändern</button>
  </form>

  <p class="hinweis">
    Nach der Änderung bleibst du hier angemeldet. Sitzungen auf anderen
    Geräten laufen aus.
  </p>
{% endblock %}
